# Newman project config
# This file is the project deployment config generated during initialization.
# backend/config/defaults.yaml provides the built-in baseline template and fallback values.
# Keep actual project settings here.
# Model settings and secrets can still be overridden through NEWMAN_* values in .env when needed.

deployment_profile: "none"

server:
  host: "0.0.0.0"
  port: 8005

runtime:
  max_tool_depth: 30
  context_compress_threshold: 0.85
  context_compaction_preserve_recent: 4
  context_compaction_max_failures: 3
  tool_retry_attempts: 3
  tool_retry_backoff_seconds: 1.0
  provider_retry_attempts: 3
  provider_retry_backoff_seconds: 1.0

sandbox:
  enabled: true
  backend: "linux_bwrap"
  mode: "workspace-write"
  network_access: true
  writable_roots: []
  timeout: 30
  output_limit_bytes: 10240
  probe_timeout_ms: 5000
  allow_partial_enforcement: false
  require_network_isolation: true
  require_process_isolation: true
  provider_path: null
  env_allowlist:
    - "PATH"
    - "HOME"
    - "LANG"
    - "LC_*"
    - "TMPDIR"
    - "TMP"
    - "TEMP"
    - "NEWMAN_RUNTIME_WORKSPACE"
    - "NEWMAN_PLUGIN_ROOT"
    - "NEWMAN_PLUGIN_NAME"
    - "NEWMAN_LARK_DEFAULT_IM_USER_ID"
    - "NEWMAN_LARK_DEFAULT_IM_IDENTITY"
  allow_automatic_full_access: false

approval:
  level1_blacklist:
    - "rm -rf /"
    - "sudo"
    - "su "
    - "chmod 777 /"
    - "chown root"
  level2_patterns:
    - "write_file_outside_workspace"
    - "process_spawn"
    - "terminal_mutation_or_unknown"
    - "plugin_cli_mutating"
    - "danger_full_access_terminal"
    - "maintain_memory"
    - "maintain_skill"
    - "maintain_plugin"
    - "maintain_tool"
  timeout_seconds: 120

permissions:
  readable_paths:
    - "."
  writable_paths:
    - "test_runtimespace"
    - "backend_data/memory"
    - "skills"
    - "plugins"
    - "backend/tools"
  protected_paths:
    - ".env"

channels:
  feishu:
    enabled: true
    transport: "channel_sdk"
    domain: "https://open.feishu.cn"
    default_turn_approval_mode: "auto_allow"
    require_mention_in_group: true
    allowed_chat_ids: []
    allowed_user_open_ids: []
    reply_timeout_seconds: 20
    dedup_ttl_seconds: 600
  wecom:
    enabled: true

paths:
  workspace: "test_runtimespace"
  browse_root: "."
  output_root: "test_runtimespace/outputs/chat"
  data_dir: "backend_data"
  sessions_dir: "backend_data/sessions"
  memory_dir: "backend_data/memory"
  audit_dir: "backend_data/audit"
  plugins_dir: "plugins"
  skills_dir: "skills"
  mcp_dir: "backend_data/mcp"
  scheduler_dir: "backend_data/scheduler"
  channels_dir: "backend_data/channels"

evolution:
  analysis_max_tokens: 10000
